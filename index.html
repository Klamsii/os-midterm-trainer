<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Adaptive Operating Systems midterm trainer with 20 unique English exam variants and multilingual explanations.">
  <meta name="theme-color" content="#11110f">
  <title>OS Midterm Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="#dashboard" aria-label="OS Midterm Trainer home">
      <span class="brand-mark">OS</span>
      <span>
        <strong>Midterm Trainer</strong>
        <small>Linux Essentials practice</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Primary navigation">
      <a href="#dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#library" data-nav="library">Study library</a>
      <a href="#analytics" data-nav="analytics">Analytics</a>
    </nav>

    <label class="language-control">
      <span>Explanation</span>
      <select id="languageSelect" aria-label="Explanation language">
        <option value="kk">Қазақша</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>

  <main id="main" tabindex="-1">
    <section id="dashboardView" class="view"></section>
    <section id="examView" class="view" hidden></section>
    <section id="resultsView" class="view" hidden></section>
    <section id="libraryView" class="view" hidden></section>
    <section id="analyticsView" class="view" hidden></section>
  </main>

  <footer class="site-footer">
    <span>Built for focused OS midterm preparation.</span>
    <span>Questions: English · Explanations: Қазақша / Русский / English</span>
  </footer>

  <template id="topicBarTemplate">
    <div class="topic-bar">
      <div class="topic-bar-label"><span></span><strong></strong></div>
      <div class="bar-track"><i></i></div>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
